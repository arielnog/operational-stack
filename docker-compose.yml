version: "3.9"

# =============================================================
#  VPS STACK — Infraestrutura base
#  Arquitetura: docs/ARCHITECTURE.md
#
#  Serviços: Traefik · Metabase (banco próprio) · Grafana
#            Loki · Alloy · Redis
#
#  Sem Postgres global — cada app sobe seu próprio banco
# =============================================================

networks:
  # Roteamento externo — Traefik + serviços com rota pública
  traefik_public:
    external: true

  # Comunicação interna — Redis, Loki, Alloy, Grafana, apps
  infra_internal:
    external: true

  # Metabase conecta aos bancos das apps (read-only)
  # Apps conectam o Postgres delas a esta rede
  infra_data: 
    external: true

  # Observabilidade — Loki, Alloy, Prometheus e Grafana
  observability:
    external: true

volumes:
  metabase_db_data:
  metabase_data:
  grafana_data:
  loki_data:
  traefik_certs:
  redis_data:
  rabbitmq_data:
  alloy_data:
  prometheus_data:

# =============================================================
services:

  # -----------------------------------------------------------
  # TRAEFIK — Proxy reverso + SSL automático via Let's Encrypt
  # -----------------------------------------------------------
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik_public
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
      - TRAEFIK_CERTIFICATESRESOLVERS_CLOUDFLARE_ACME_EMAIL=${LETSENCRYPT_EMAIL}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/certs
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/dynamic.yml:/dynamic.yml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=cloudflare"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=auth@docker"
      # Só via tailnet (DNS traefik.int → IP 100.x da VPS, nuvem cinza)
      - "traefik.http.routers.traefik-dashboard-int.rule=Host(`traefik.int.${DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard-int.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard-int.tls.certresolver=cloudflare"
      - "traefik.http.routers.traefik-dashboard-int.service=api@internal"
      - "traefik.http.routers.traefik-dashboard-int.middlewares=tailnet-only@file,auth@docker"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # -----------------------------------------------------------
  # POSTGRES — Banco exclusivo do Metabase
  # -----------------------------------------------------------
  metabase-db:
    image: postgres:16-alpine
    container_name: metabase-db
    restart: unless-stopped
    networks:
      - infra_internal
    environment:
      POSTGRES_DB: ${METABASE_DB}
      POSTGRES_USER: ${METABASE_DB_USER}
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - metabase_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${METABASE_DB_USER} -d ${METABASE_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 128mb

  # -----------------------------------------------------------
  # METABASE — BI (leitura dos bancos das apps via infra_data)
  # -----------------------------------------------------------
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: unless-stopped
    networks:
      - traefik_public
      - infra_internal
      - infra_data
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB:-metabase}
      MB_DB_PORT: 5432
      MB_DB_USER: ${METABASE_DB_USER:-metabase_user}
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      MB_DB_HOST: metabase-db
      MB_SITE_URL: https://metabase.int.${DOMAIN}
      JAVA_TIMEZONE: America/Sao_Paulo
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      metabase-db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # Só via tailnet (DNS metabase.int → IP 100.x da VPS, nuvem cinza)
      - "traefik.http.routers.metabase-int.rule=Host(`metabase.int.${DOMAIN}`)"
      - "traefik.http.routers.metabase-int.entrypoints=websecure"
      - "traefik.http.routers.metabase-int.tls.certresolver=cloudflare"
      - "traefik.http.routers.metabase-int.middlewares=tailnet-only@file"
      - "traefik.http.services.metabase.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # -----------------------------------------------------------
  # GRAFANA — Logs e métricas (usa SQLite interno)
  # -----------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    networks:
      - traefik_public
      - infra_internal
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.int.${DOMAIN}
      GF_SERVER_DOMAIN: grafana.int.${DOMAIN}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_LOG_MODE: console
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    labels:
      - "traefik.enable=true"
      # Só via tailnet (DNS grafana.int → IP 100.x da VPS, nuvem cinza)
      - "traefik.http.routers.grafana-int.rule=Host(`grafana.int.${DOMAIN}`)"
      - "traefik.http.routers.grafana-int.entrypoints=websecure"
      - "traefik.http.routers.grafana-int.tls.certresolver=cloudflare"
      - "traefik.http.routers.grafana-int.middlewares=tailnet-only@file"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # -----------------------------------------------------------
  # REDIS — Cache/filas compartilhado (ver redis/databases.md)
  # noeviction: memória cheia recusa escrita em vez de apagar chaves
  # (filas e índices não podem sumir). Toda chave de cache precisa de TTL.
  # AOF (appendonly) limita a perda em queda a ~1 s.
  # -----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    networks:
      - infra_internal
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
      --save 60 1
      --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # -----------------------------------------------------------
  # RABBITMQ — Mensageria compartilhada (ver rabbitmq/README.md)
  # Um vhost e um usuário por app. hostname fixo: o RabbitMQ guarda os
  # dados pelo nome do nó, e recriar o container com outro hostname
  # perderia filas e mensagens. Painel (15672) só na rede interna.
  # -----------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    networks:
      - infra_internal
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # -----------------------------------------------------------
  # LOKI — Agregação de logs
  # -----------------------------------------------------------
  loki:
    image: grafana/loki:2.9.7
    container_name: loki
    restart: unless-stopped
    networks:
      - infra_internal
      - observability
    command: -config.file=/etc/loki/loki.yml -target=all -config.expand-env=true
    volumes:
      - loki_data:/loki
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3100 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # -----------------------------------------------------------
  # ALLOY — Substituto do Promtail (EOL). Mesmos labels no Loki.
  # UI/métricas na 12345 só dentro da rede, sem porta no host.
  # -----------------------------------------------------------
  alloy:
    image: grafana/alloy:v1.20.1
    container_name: alloy
    restart: unless-stopped
    # observability: Loki e Prometheus. Demais redes: alcançar apps, Redis,
    # bancos e Traefik para os probes e exporters.
    networks:
      - observability
      - infra_internal
      - traefik_public
    # Carrega todos os .alloy da pasta (logs.alloy, metrics.alloy)
    command: run /etc/alloy --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data
    # cgroup do host: o cAdvisor precisa enxergar os cgroups de todos os containers
    cgroup: host
    volumes:
      - ./alloy:/etc/alloy:ro
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - alloy_data:/var/lib/alloy/data
      # node e cAdvisor leem o host (somente leitura)
      - /:/rootfs:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      - /run/udev/data:/run/udev/data:ro
    depends_on:
      loki:
        condition: service_healthy

  # -----------------------------------------------------------
  # PROMETHEUS — Armazena as métricas enviadas pelo Alloy
  # 9090 só dentro da rede observability, sem porta no host.
  # -----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    restart: unless-stopped
    networks:
      - observability
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
