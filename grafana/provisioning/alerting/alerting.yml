# grafana/provisioning/alerting/alerting.yml
# Alertas da pasta Infra → Telegram (bot e grupo dedicados; token e chat_id no .env).
# Evite "$" nos textos: o Grafana troca $VAR por variável de ambiente neste arquivo.
# Por isso as anotações usam {{ .Labels.x }} em vez de {{ $labels.x }}.
#
# Toda regra (deste repositório ou das aplicações) leva duas labels, que viram a origem na mensagem:
#   app:       a aplicação (notification-price, financas...; "infra" para VPS, Traefik, disco)
#   container: o container de onde vem o problema; pode vir da query ('{{ index .Labels "name" }}')
# e a severity: critical vira 🚨 INCIDENTE; warning vira ⚠️ AVISO.

apiVersion: 1

# ── Mensagem ─────────────────────────────────────────────────────────
# Telegram com parse_mode HTML: o summary passa por "html" para "<" e "&" não quebrarem o envio.
templates:
  - orgId: 1
    name: telegram
    template: |
      {{ define "telegram.text" -}}
      {{ range .Alerts -}}
      {{ if eq .Labels.severity "warning" -}}
      {{ if eq .Status "firing" }}⚠️ <b>ALERTA - AVISO</b> ⚠️{{ else }}✅ <b>AVISO RESOLVIDO</b> ✅{{ end }}
      {{- else -}}
      {{ if eq .Status "firing" }}🚨 <b>ALERTA - INCIDENTE</b> 🚨{{ else }}✅ <b>INCIDENTE RESOLVIDO</b> ✅{{ end }}
      {{- end }}

      - <b>Aplicação:</b> {{ or .Labels.app "não informada" | html }}
      - <b>Container:</b> {{ or .Labels.container "não informado" | html }}
      - <b>Mensagem:</b> {{ .Annotations.summary | html }}

      {{ end -}}
      {{- end }}

      {{ define "telegram.payload" -}}
      {{ coll.Dict "chat_id" (reReplaceAll "^id:" "" .Vars.chat) "text" (tmpl.Exec "telegram.text" .) "parse_mode" "HTML" "disable_web_page_preview" true | data.ToJSON }}
      {{- end }}

# Template e contact point do WhatsApp (Evolution), substituídos pelo Telegram.
deleteTemplates:
  - orgId: 1
    name: whatsapp

deleteContactPoints:
  - orgId: 1
    uid: whatsapp-evolution

# ── Para onde vai ────────────────────────────────────────────────────
# API oficial do Telegram, sem depender de nada da VPS além da saída para a internet.
# Bot e grupo dedicados aos alertas (token e chat_id no .env).
# Webhook direto no sendMessage em vez da integração "telegram": nela o chatid vindo do .env
# vira número (o Grafana converte o valor interpolado) e o provisioning falha, derrubando o Grafana.
# Aqui o "id:" mantém o valor como texto e o template remove o prefixo (mesma ideia do antigo "tel:").
contactPoints:
  - orgId: 1
    name: telegram
    receivers:
      - uid: telegram-bot
        type: webhook
        settings:
          url: https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage
          httpMethod: POST
          payload:
            template: '{{ template "telegram.payload" . }}'
            vars:
              chat: "id:${TELEGRAM_ALERT_CHAT_ID}"

policies:
  - orgId: 1
    receiver: telegram
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

# ── Regras ───────────────────────────────────────────────────────────
# Cada regra: A = query instantânea no Prometheus, C = limite sobre A.
groups:
  - orgId: 1
    name: infra
    folder: Infra
    interval: 1m
    rules:
      - uid: app-down
        title: App fora do ar
        condition: C
        for: 2m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: critical
          app: infra
          container: '{{ index .Labels "instance" }}'
        annotations:
          summary: "{{ .Labels.instance }} não responde no health interno."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: probe_success{job="health"}
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: traefik-5xx
        title: Muitos erros 5xx
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          app: infra
          container: traefik
        annotations:
          summary: "{{ .Labels.service }} com mais de 5% de respostas 5xx."
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              # Só conta serviço com pelo menos 10 requests em 5 min (evita 1 erro = 100%)
              expr: >-
                (sum by (service) (rate(traefik_service_requests_total{code=~"5.."}[5m]))
                / sum by (service) (rate(traefik_service_requests_total[5m])))
                and on (service) sum by (service) (increase(traefik_service_requests_total[5m])) >= 10
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }

      - uid: disk-low
        title: Disco quase cheio
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: critical
          app: infra
          container: host (disco da VPS)
        annotations:
          summary: "Menos de 15% livre no disco / da VPS."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 100 * node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [15] }

      - uid: tls-expiring
        title: Certificado TLS vencendo
        condition: C
        for: 1h
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          app: infra
          container: traefik
        annotations:
          summary: "Certificado {{ .Labels.cn }} vence em menos de 14 dias."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: min by (cn) ((traefik_tls_certs_not_after - time()) / 86400)
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [14] }

      - uid: container-restarting
        title: Container reiniciando
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          app: infra
          container: '{{ index .Labels "name" }}'
        annotations:
          summary: "{{ .Labels.name }} reiniciou 2 ou mais vezes em 15 min."
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum by (name) (changes(container_start_time_seconds{name!=""}[15m]))
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1] }

      - uid: target-down
        title: Coleta de métricas falhando
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
          app: infra
          container: '{{ index .Labels "instance" }}'
        annotations:
          summary: "Job {{ .Labels.job }} ({{ .Labels.instance }}) com up == 0."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: up
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
