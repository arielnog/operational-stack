# Regras de alerta do notification-price (F4.2, RN-20, F6.E1), no formato de provisionamento do Grafana.
# Avisam falha de verdade: canal quieto não é falha (o "Nenhuma promo em 1 h" saiu na F6.5).
#
# Copie para grafana/provisioning/alerting/notification-price.yml no operational-stack. As regras usam
# o datasource do Loki pelo uid fixo de lá (P8E80F9AEF21F6940, em grafana/provisioning/datasources/); o
# "Container do notification-price parado" usa o Prometheus (uid prometheus, métricas do cAdvisor no Alloy).
# O destino vem do alerting.yml do operational-stack: a política padrão manda tudo para o WhatsApp,
# que mostra a aplicação (label app), o container (label container) e o summary.
# Evite "$" nos textos: o Grafana troca $VAR por variável de ambiente.
apiVersion: 1

# Regra tirada do arquivo continua no Grafana: o deleteRules apaga (F6.5).
deleteRules:
  - orgId: 1
    uid: np-no-promo-1h

groups:
  - orgId: 1
    name: notification-price
    folder: notification-price
    interval: 1m
    rules:
      # O worker-maintenance grava metrics.snapshot a cada minuto. Sem snapshot em 5 min, ele caiu.
      - uid: np-worker-down
        title: Worker de manutenção parado
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
          app: notification-price
          container: notification-price-worker-maintenance
        annotations:
          summary: O worker-maintenance não registra métricas há 5 min.
          description: Sem métricas nem recuperação de alertas. Verifique o container notification-price-worker-maintenance.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: P8E80F9AEF21F6940
            model:
              refId: A
              queryType: instant
              expr: 'sum(count_over_time({container=~"notification-price-worker-.*"} |= `"message":"metrics.snapshot"` [5m]))'
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }

      # F4.2: fila parada há mais de 5 min (alerta pendente mais antigo).
      - uid: np-queue-stuck
        title: Fila de alertas parada
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          app: notification-price
          container: notification-price-worker-sender
        annotations:
          summary: Há alerta pendente há mais de 5 min.
          description: Verifique a instância bot e os logs de notification.retry (runbook "Fila parada").
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: P8E80F9AEF21F6940
            model:
              refId: A
              queryType: instant
              expr: 'max(max_over_time({container=~"notification-price-worker-.*"} |= `"message":"metrics.snapshot"` | json | unwrap context_oldest_pending_notification_s [5m]))'
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [300] }

      # F4.2: mais de 5% dos envios da última hora terminaram em failed.
      # Cada soma leva "or vector(0)": sem nenhum notification.sent na hora (a falha total), a soma
      # vazia apagava a expressão inteira e o noDataState OK escondia a queda.
      - uid: np-failed-rate
        title: Taxa de falha de envio acima de 5%
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          app: notification-price
          container: notification-price-worker-sender
        annotations:
          summary: Mais de 5% dos alertas da última hora falharam.
          description: Normalmente a instância bot desconectada ou bloqueada (runbook "Falhas de envio").
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: P8E80F9AEF21F6940
            model:
              refId: A
              queryType: instant
              expr: >-
                (sum(count_over_time({container=~"notification-price-worker-.*"} |= `"message":"notification.failed"` [1h])) or vector(0))
                / ((sum(count_over_time({container=~"notification-price-worker-.*"} |= `"message":"notification.sent"` [1h])) or vector(0))
                + (sum(count_over_time({container=~"notification-price-worker-.*"} |= `"message":"notification.failed"` [1h])) or vector(0)))
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.05] }

      # Fila de entrada sem consumidor em todos os snapshots dos últimos 5 min: o container do worker que
      # a consome está parado. Pelo máximo da janela, um deploy (consumidor 0 por segundos) não dispara;
      # -1 (API do RabbitMQ sem resposta) também não. Sem fila zerada, a consulta volta vazia (noData OK).
      - uid: np-consumer-down
        title: Consumidor do RabbitMQ parado (promoções)
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          app: notification-price
          container: notification-price-worker-promotions
        annotations:
          summary: A fila de promoções do RabbitMQ está sem consumidor há 5 min.
          description: Verifique o container notification-price-worker-promotions (docker compose up -d).
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: P8E80F9AEF21F6940
            model:
              refId: A
              queryType: instant
              expr: 'max(max_over_time({container=~"notification-price-worker-.*"} |= `"message":"metrics.snapshot"` | json | unwrap context_rabbitmq_promotions_consumers [5m])) == 0'
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: np-consumer-down-bot
        title: Consumidor do RabbitMQ parado (comandos)
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          app: notification-price
          container: notification-price-worker-commands
        annotations:
          summary: A fila de mensagens do bot do RabbitMQ está sem consumidor há 5 min.
          description: Verifique o container notification-price-worker-commands (docker compose up -d).
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: P8E80F9AEF21F6940
            model:
              refId: A
              queryType: instant
              expr: 'max(max_over_time({container=~"notification-price-worker-.*"} |= `"message":"metrics.snapshot"` | json | unwrap context_rabbitmq_bot_consumers [5m])) == 0'
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }

      # F6.6: o worker-maintenance não alcançou a API de gestão do RabbitMQ em nenhum snapshot dos últimos 3 min.
      # Sem o RabbitMQ não entra promo nem comando, e o telegram-reader guarda as mensagens até ele voltar.
      # Worker-maintenance parado não dispara aqui (sem snapshot): o "Worker de manutenção parado" cobre.
      - uid: np-rabbitmq-down
        title: RabbitMQ fora
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          app: notification-price
          container: rabbitmq
        annotations:
          summary: O RabbitMQ não responde há 3 min. Promos e comandos do bot não entram.
          description: Verifique o container rabbitmq (operational-stack) e os logs telegram.publish_retry do telegram-reader (runbook "RabbitMQ fora").
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: P8E80F9AEF21F6940
            model:
              refId: A
              queryType: instant
              expr: 'max(max_over_time({container=~"notification-price-worker-.*"} |= `"message":"metrics.snapshot"` | json | unwrap context_rabbitmq_up [3m]))'
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }

      # F6.7: mensagens represadas. Pelo mínimo da janela: a fila ficou acima do limite em todos os snapshots dos
      # últimos 10 min, então um lote do Telegram (que esvazia em segundos) não dispara. Até 02/11 nenhuma fila
      # passou de 0 por 10 min seguidos. -1 (API do RabbitMQ sem resposta) fica de fora: é o "RabbitMQ fora".
      - uid: np-backlog
        title: Mensagens represadas (promoções)
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          app: notification-price
          container: notification-price-worker-promotions
        annotations:
          summary: Há promoções paradas na fila de entrada ou no match há 10 min.
          description: Veja no dashboard qual fila cresce e o worker dela (runbook "Mensagens represadas").
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: P8E80F9AEF21F6940
            model:
              refId: A
              queryType: instant
              expr: >-
                (min(min_over_time({container=~"notification-price-worker-.*"} |= `"message":"metrics.snapshot"` | json | unwrap context_rabbitmq_promotions_messages [10m])) > 20)
                or (min(min_over_time({container=~"notification-price-worker-.*"} |= `"message":"metrics.snapshot"` | json | unwrap context_queues_default_waiting [10m])) > 50)
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: np-backlog-bot
        title: Mensagens represadas (comandos)
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          app: notification-price
          container: notification-price-worker-commands
        annotations:
          summary: Há mensagens do bot paradas na fila de entrada há 10 min.
          description: Veja no dashboard qual fila cresce e o worker dela (runbook "Mensagens represadas").
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: P8E80F9AEF21F6940
            model:
              refId: A
              queryType: instant
              expr: >-
                min(min_over_time({container=~"notification-price-worker-.*"} |= `"message":"metrics.snapshot"` | json | unwrap context_rabbitmq_bot_messages [10m])) > 5
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: np-backlog-sender
        title: Mensagens represadas (envios)
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          app: notification-price
          container: notification-price-worker-sender
        annotations:
          summary: Há alertas e respostas parados na fila de envio há 10 min.
          description: Veja no dashboard qual fila cresce e o worker dela (runbook "Mensagens represadas").
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: P8E80F9AEF21F6940
            model:
              refId: A
              queryType: instant
              expr: >-
                min(min_over_time({container=~"notification-price-worker-.*"} |= `"message":"metrics.snapshot"` | json | unwrap context_queues_notifications_waiting [10m])) > 30
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      # F5e.10: o link-service grava links.heartbeat a cada minuto. Sem heartbeat em 5 min, o serviço caiu e todos os
      # links dos alertas (promo.arnsolutions.tech) param de abrir.
      - uid: np-links-down
        title: Serviço de links parado
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
          app: notification-price
          container: notification-price-link-service
        annotations:
          summary: O link-service não dá sinal há 5 min. Os links dos alertas não abrem.
          description: Verifique o container notification-price-link-service (docker compose up -d link-service). Para os alertas novos levarem o link da loja, OFFER_PAGE_ENABLED=false no .env e docker compose up -d.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: P8E80F9AEF21F6940
            model:
              refId: A
              queryType: instant
              expr: 'sum(count_over_time({container="notification-price-link-service"} |= `"message":"links.heartbeat"` [5m]))'
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }

      # F5e.10: o link-service está de pé, mas o worker-api não responde: os cliques caem em "Tente de novo".
      - uid: np-links-api-down
        title: Página de oferta sem o worker-api
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          app: notification-price
          container: notification-price-worker-api
        annotations:
          summary: O link-service não alcança o worker-api. Os links dos alertas mostram "Tente de novo".
          description: Verifique o container notification-price-worker-api (docker compose up -d worker-api).
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: P8E80F9AEF21F6940
            model:
              refId: A
              queryType: instant
              expr: 'sum(count_over_time({container="notification-price-link-service"} |= `"message":"links.heartbeat"` | json | context_hyperf="false" [5m]))'
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [2] }

      # Fase 5e: o gerador do Mercado Livre recusou a sessão. Os cliques do ML vão para o link da loja, sem afiliado,
      # até trocar o cookie.
      - uid: np-ml-session-expired
        title: Sessão do Mercado Livre expirou
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          app: notification-price
          container: notification-price-link-service
        annotations:
          summary: A sessão do Mercado Livre expirou. Os cliques do ML saem sem o link de afiliado.
          description: Troque AFFILIATE_MERCADOLIVRE_COOKIE no .env (README, "Sessão do Mercado Livre expirou") e rode docker compose up -d link-service.
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: P8E80F9AEF21F6940
            model:
              refId: A
              queryType: instant
              expr: 'sum(count_over_time({container="notification-price-link-service"} |= `"message":"affiliate.fallback"` |= `"reason":"session_expired"` [30m]))'
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      # F6.8: o provider de afiliado deu erro (timeout, rede, http_5xx, resposta inválida) em 2 cliques ou mais na
      # última meia hora: esses cliques foram para o link da loja, sem afiliado. "declined" (o provider não atende o
      # link) não é erro, e "session_expired" tem o alerta próprio acima.
      - uid: np-affiliate-error
        title: Erro ao gerar o link de afiliado
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          app: notification-price
          container: notification-price-link-service
        annotations:
          summary: O link de afiliado falhou em 2 ou mais cliques na última meia hora. Esses cliques saíram sem afiliado.
          description: Veja o motivo (reason) nos logs affiliate.fallback do notification-price-link-service (runbook "Erro no link de afiliado").
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: P8E80F9AEF21F6940
            model:
              refId: A
              queryType: instant
              expr: 'sum(count_over_time({container="notification-price-link-service"} |= `"message":"affiliate.fallback"` | json | context_reason!="declined" | context_reason!="session_expired" [30m]))'
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [1] }

      # F6.9: 3 usuários diferentes ou mais removeram produto ou pausaram em 24 h (com 20 usuários no beta). Pode ser
      # alerta ruim (match errado, repetido, de madrugada) ou o bot mandando demais.
      - uid: np-users-leaving
        title: Muitos usuários parando de acompanhar
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          app: notification-price
          container: notification-price-worker-commands
        annotations:
          summary: 3 ou mais usuários removeram produto ou pausaram os alertas nas últimas 24 h.
          description: Veja quais termos e alertas vieram antes (runbook "Usuários parando"); o limite está em ops/grafana/notification-price-alerts.yaml.
        data:
          - refId: A
            relativeTimeRange: { from: 86400, to: 0 }
            datasourceUid: P8E80F9AEF21F6940
            model:
              refId: A
              queryType: instant
              expr: 'count(sum by (context_user_id) (count_over_time({container=~"notification-price-worker-.*"} |= `"message":"command.handled"` | json | context_command=~"remove|pause" [24h])))'
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [2] }

      # F6.10: container do notification-price parado, morto ou removido. Cobre também o telegram-reader, o link-service
      # e o worker-api, que não têm /health sondado. O cAdvisor deixa de mandar o container parado, mas o Prometheus
      # ainda devolve a última amostra por 5 min: nesse tempo o container_last_seen fica parado e a idade cresce (a
      # coleta é a cada 30 s, então até ~60 s é normal); depois a série some, e a segunda parte pega o container que
      # rodou na última hora e não está mais lá. Um deploy (recria em segundos) não dispara. Testado em 02/11 parando
      # um container: dispara em ~3 min. Container tirado de propósito dispara por até 1 h: silencie no Grafana.
      # Container avulso do docker compose run (migration, comando) termina sozinho e fica de fora (-run-).
      - uid: np-container-down
        title: Container do notification-price parado
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          app: notification-price
          container: '{{ index .Labels "name" }}'
        annotations:
          summary: O container parou ou foi removido (sem sinal do cAdvisor há mais de 2 min).
          description: docker ps -a e docker logs do container; para subir, docker compose up -d no /opt/notification-price.
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                (time() - max by (name) (container_last_seen{name=~"notification-price-.*", name!~".*-run-.*"}) > 120)
                or (max by (name) (max_over_time(container_last_seen{name=~"notification-price-.*", name!~".*-run-.*"}[1h]))
                unless max by (name) (container_last_seen{name=~"notification-price-.*", name!~".*-run-.*"}))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
