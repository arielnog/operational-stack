# dynamic.yml — Configuração dinâmica: middlewares e TLS

http:
  middlewares:

    # Cabeçalhos de segurança para todas as rotas
    secHeaders:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: "SAMEORIGIN"
        referrerPolicy: "strict-origin-when-cross-origin"
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"

    # Rate limiting global
    rateLimit:
      rateLimit:
        average: 100
        burst: 50
        period: 1s
        sourceCriterion:
          ipStrategy:
            depth: 1

    # Middleware para apps internas (adiciona rate limit + headers)
    secureApp:
      chain:
        middlewares:
          - secHeaders
          - rateLimit

    # Rate limit da API do /historico do price-redirect (busca e produto). Mais justo que o global: a tela faz
    # no máximo umas 3 chamadas por segundo (busca com espera de 300 ms e rolagem), um script que varre o catálogo
    # faz muito mais. Acima do limite, 429.
    historyApiRateLimit:
      rateLimit:
        average: 5
        burst: 20
        period: 1s
        sourceCriterion:
          ipStrategy:
            depth: 1

    # Rota /historico/api do price-redirect: cabeçalhos de segurança + o limite acima (no lugar do global)
    secureHistoryApi:
      chain:
        middlewares:
          - secHeaders
          - historyApiRateLimit

    # Só aceita origem no tailnet (*.int). Barra quem bate no IP público
    # com Host: <svc>.int..., já que portas publicadas pelo Docker ignoram o UFW
    tailnet-only:
      ipAllowList:
        sourceRange:
          - 100.64.0.0/10

tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
      sniStrict: true
